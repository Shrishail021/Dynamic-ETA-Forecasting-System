# TODO(Antigravity): this brings up backend + frontend together for local
# dev. Add a db service (postgres) once you move off in-memory storage.
version: "3.9"
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    volumes:
      - ./backend:/app
      - ./data:/app/../data
      - ./ml:/app/../ml
  frontend:
    image: node:22-slim
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
